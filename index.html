<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="start-screen" id="start-screen">
        <div class="start-text">Click anywhere to begin</div>
    </div>

    <main class="scene">
        
        <div class="cat-window" id="cat-window">
            <div class="cat-window-titlebar" id="cat-window-titlebar">
                <span>Cat Window</span>
                <button class="cat-window-close" id="cat-window-close" type="button" aria-label="Close cat window">X</button>
            </div>
            <div class="cat-window-content">
                <button class="desktop-icon" type="button" data-folder="readMe.txt">
                    <span class="desktop-icon-art notepad-icon" aria-hidden="true"></span>
                    <span>Readme.txt</span>
                </button>
                <button class="desktop-icon" type="button" data-folder="i want to">
                    <span class="desktop-icon-art folder-icon" aria-hidden="true"></span>
                    <span>i want to</span>
                </button>
                <button class="desktop-icon" id="notepad-icon" type="button">
                    <span class="desktop-icon-art notepad-icon" aria-hidden="true"></span>
                    <span>Draw</span>
                </button>
            </div>
            <button class="cat-window-resize" id="cat-window-resize" type="button" aria-label="Resize cat window"></button>
        </div>

        <img src="assets/sky2.png" class="sky">

        <div class="water">

            <div class="water-wave back-wave">
                <img src="assets/water.gif" alt="">
            </div>

            <div class="water-wave front-wave">
                <img src="assets/water-slow.gif" alt="">
            </div>

        </div>

        <img src="assets/cat-with-shadow.png" class="character-boat">

        <div class="character-hitbox" id="character-hitbox"></div>

        <div class="dialogue" id="dialogue">
            <div class="dialogue-box" id="dialogue-text"></div>
            <div class="dialogue-tail"></div>
        </div>

        <div class="boombox-hitbox" id="boombox-button">
            <img src="assets/boombox.png" alt="Music">
        </div>

        <div class="music-container">

            <div class="music-player" id="music-player">

                <div class="music-title">
                    Now Playing:<br>
                    <span id="current-song">Song Name</span>
                </div>

                <div class="song-name" id="artist-name">
                    By Artist Name
                </div>

                <div class="music-controls">
                    <button id="prev-song">◀</button>
                    <button id="play-pause">| |</button>
                    <button id="next-song">▶</button>
                </div>

                <button class="window-resize-handle" id="music-player-resize" type="button" aria-label="Resize music player"></button>

            </div>

            <div class="volume-player" id="volume-player">
                <div class="volume-title">VOL</div>

                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                <button class="window-resize-handle" id="volume-player-resize" type="button" aria-label="Resize volume control"></button>
            </div>

        </div>

        <audio id="bg-music"></audio>

    </main>

    <script src="script.js"></script>


</body>


</html>
